# Builds the program once and runs the tests on it: on a pull request (not a draft one), on a push to main,
# and by hand. A push to any other branch (develop included) runs nothing: its pull request does, so a
# commit is not built twice (once for the push and once for the pull request). A newer push to the same
# branch or pull request stops the older run. The NuGet packages (the AOT compiler is the big one) are
# cached by the files that decide their versions, so a build does not download them again.
#
# The version of a build is worked out from git (get-version.ps1), so that a push to a branch, a pull
# request and a release never share one. The program is kept as an artifact for 14 days, before the tests
# run, so that a red test run still leaves it. The tests take that very program (WSLBIN_TEST_EXE) instead
# of building their own. The tests that need WSL do not run here (the runners have none); the escaping is
# still checked by the Git Bash that the runners have.
#
# What anyone can choose (the name of a branch, the number of a pull request) reaches the scripts through
# env: only, never pasted into the text of a run:; tests/workflows.Tests.ps1 checks that. The actions are
# pinned to the commit of a release tag (the comment names the tag); look up a new one with
#   git ls-remote --tags https://github.com/<owner>/<action> refs/tags/<tag>
# Not run on GitHub yet: the repository has not been pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # a draft pull request waits until it is marked ready
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # the whole history, because PATCH of the version is counted from it; for a pull request the head
      # of its branch, not the merge commit that GitHub makes (it will not exist after the merge)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: NuGet packages (the AOT compiler and the runtime packs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'wslbin.csproj', 'Directory.Build.props', 'nuget.config') }}

      - name: Version of this build
        id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ($env:EVENT -eq 'pull_request') {
              $version = ./get-version.ps1 -Kind pr -PullRequest $env:PR_NUMBER -Run $env:RUN_NUMBER -Commit $env:COMMIT
          }
          else {
              $version = ./get-version.ps1 -Kind branch -Branch $env:BRANCH -Run $env:RUN_NUMBER -Commit $env:COMMIT
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version $version"

      - name: Build (Native AOT)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -Version $env:VERSION

      - name: The program says the version that was asked for
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: ./.github/check-version.ps1

      - name: Keep the program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wslbin-${{ steps.version.outputs.version }}
          path: bin/wslbin.exe
          retention-days: 14
          if-no-files-found: error
          overwrite: true   # a re-run of the same run number has the same name

      - name: Pester 5 or later
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Test (everything not tagged WSL) on the program that was built
        shell: pwsh
        run: |
          # every test file takes this program instead of building its own (the tests of the build and of the
          # stand-in wsl.exe still build theirs); a copy outside bin\, which a build may write
          $exe = Join-Path $env:RUNNER_TEMP 'wslbin-under-test\wslbin.exe'
          New-Item -ItemType Directory -Path (Split-Path -Parent $exe) -Force | Out-Null
          Copy-Item -LiteralPath bin/wslbin.exe -Destination $exe
          $env:WSLBIN_TEST_EXE = $exe
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Filter.ExcludeTag = 'WSL'
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config
