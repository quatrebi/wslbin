# A release is made by a button: Actions > Release > Run workflow, on main. Nothing is tagged by hand;
# this workflow makes the tag v<version> on the commit that it built and tested.
#
# The version is the one of the commit (get-version.ps1 -Kind release): MAJOR.MINOR from wslbin.csproj, PATCH
# counted from git. Five jobs, each with the least rights it needs:
#   build    reads: works the version out, stops when it is released already, builds the program, checks
#            that it reports the version, and hands it on as an artifact
#   test     reads: runs the tests on that very program (WSLBIN_TEST_EXE)
#   release  writes the release and signs: makes the zip of that very program, its SHA256 and the
#            attestation, and publishes them on the commit of this run. It builds nothing: what is
#            released is what was tested, and no compiler runs where a token can write.
#   pages    deploys the site (pages.yml, called): the list of releases, releases.json, is made from them
#   probe    reads the site and checks that it names the version that was released
#
# What is in the zip: wslbin.exe, LICENSE, manifest.json and the scripts of the installer (setup/), made by
# .github/make-package.ps1. What anyone can choose never reaches a shell by being pasted into it (env: only);
# tests/workflows.Tests.ps1 checks that. The actions are pinned to the commit of a release tag (the comment
# names it); look up a new one with:  git ls-remote --tags https://github.com/<owner>/<action> refs/tags/<tag>
# Not run on GitHub yet: the repository has not been pushed. One-time setup: Settings > Pages > Source:
# "GitHub Actions".
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Releases are made from main only
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Releases are made from main only, and this run is on $env:GITHUB_REF."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version of this release
        id: version
        shell: pwsh
        run: |
          $version = ./get-version.ps1 -Kind release
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version $version"

      - name: Not released yet
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git rev-parse -q --verify "refs/tags/v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) {
              throw "v$env:VERSION is already released: it is the version of this commit. Raise MAJOR.MINOR in a pull request, or push another commit, and run this again."
          }
          exit 0   # (git said "no such tag" with exit code 1, which is what is wanted here)

      - name: Build (Native AOT)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -Version $env:VERSION

      - name: The program says the version that was asked for
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: ./.github/check-version.ps1

      - name: Hand the program on to the tests and the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-program
          path: bin/wslbin.exe
          retention-days: 7
          if-no-files-found: error

  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # the tests of the build and of the stand-in wsl.exe build programs of their own
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: The program that was built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-program
          path: ${{ runner.temp }}/release-program

      - name: Pester 5 or later
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Test that program (everything not tagged WSL)
        shell: pwsh
        run: |
          $env:WSLBIN_TEST_EXE = Join-Path $env:RUNNER_TEMP 'release-program\wslbin.exe'
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Filter.ExcludeTag = 'WSL'
          Invoke-Pester -Configuration $config

  release:
    needs: [build, test]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # the scripts that make the package, LICENSE and setup/ of the commit of this run (the one that was built)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The program that was built and tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-program
          path: ${{ runner.temp }}/release-program

      - name: The program says the version of the release
        shell: pwsh
        run: |
          $env:EXPECTED_VERSION = $env:VERSION
          $env:PROGRAM = Join-Path $env:RUNNER_TEMP 'release-program\wslbin.exe'
          ./.github/check-version.ps1

      - name: The files of the release
        shell: pwsh
        run: |
          ./.github/make-package.ps1 -Version $env:VERSION -Exe (Join-Path $env:RUNNER_TEMP 'release-program\wslbin.exe') -OutputDir dist
          Get-ChildItem dist | Format-Table Name, Length
          Get-Content dist/SHA256SUMS.txt

      - name: Attest where the files come from
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist -File).FullName
          gh release create "v$env:VERSION" $files --target $env:GITHUB_SHA --title "wslbin $env:VERSION" --generate-notes

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  probe:
    needs: [build, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGE_URL: ${{ needs.pages.outputs.page_url }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: The site names the version that was released
        shell: pwsh
        run: |
          # (a query that changes with every run: the CDN of Pages may keep the old file for minutes)
          $url = $env:PAGE_URL.TrimEnd('/') + '/releases.json?run=' + $env:GITHUB_RUN_ID
          $latest = $null
          for ($try = 1; $try -le 10; $try++) {
              try { $latest = (Invoke-RestMethod -Uri $url -Headers @{ 'Cache-Control' = 'no-cache' }).latest }
              catch { Write-Host "try ${try}: $($_.Exception.Message)" }
              if ($latest -eq $env:VERSION) { Write-Host "$url says $latest"; exit 0 }
              Start-Sleep -Seconds 15
          }
          throw "$url says '$latest', not $env:VERSION."

      - name: The loader is served as text, so that "irm | iex" works
        shell: pwsh
        run: |
          $url = $env:PAGE_URL.TrimEnd('/') + '/install.ps1?run=' + $env:GITHUB_RUN_ID
          $script = Invoke-RestMethod -Uri $url -Headers @{ 'Cache-Control' = 'no-cache' }
          # a type of content that irm does not take for text gives bytes, and iex cannot run bytes
          if ($script -isnot [string]) { throw "$url came as $($script.GetType().FullName), not as text: irm | iex would not work." }
          if (-not $script.StartsWith('# wslbin loader')) { throw "$url does not start like the loader: $($script.Substring(0, [Math]::Min(60, $script.Length)))" }
          Write-Host "$url is the loader ($($script.Length) characters)"
