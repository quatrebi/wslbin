# A tag v<version> makes a release:
#   wslbin.exe                     built here from the source of the tag
#   wslbin-<tag>-source.zip        the source of the tag (what install.ps1 downloads and builds)
#   install.ps1                    the installer
#   SHA256SUMS.txt                 their hashes
# and an attestation (a signed statement that the files were built from this repository by this
# workflow). install.ps1 does not download wslbin.exe: it builds the source, so that the code can
# be read first. The .exe is for people who prefer to take it ready and check the attestation.
#
# Two jobs: the tests run with read rights only (they install Pester from the PowerShell Gallery when
# the runner lacks it, and run a lot of code), and only then the release job, which has the rights to
# publish and to sign, builds and publishes. The name of the tag reaches the scripts through the
# environment, never pasted into their text, and must look like a version.
#
# Not run yet: the repository has not been pushed to GitHub. The actions are pinned to the commit of
# a release tag (checked with "git ls-remote --tags" on 2026-10-21; the comment names the tag).
# To move to a newer version, look up its commit the same way.
# Before tagging: set the version attributes at the top of src/wslbin.cs to the number of the tag;
# this workflow refuses a tag that does not match.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: The tag must be the version of the program
        shell: pwsh
        run: ./.github/check-version.ps1

      - name: Pester 5 or later
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Test (everything not tagged WSL)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Filter.ExcludeTag = 'WSL'
          Invoke-Pester -Configuration $config

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: The tag must be the version of the program
        shell: pwsh
        run: ./.github/check-version.ps1

      - name: Collect the files of the release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item bin/wslbin.exe dist/
          Copy-Item install.ps1 dist/
          git archive --format=zip --prefix="wslbin-$env:TAG/" -o "dist/wslbin-$env:TAG-source.zip" HEAD
          # "<hash>  <name>", the format that install.ps1 reads
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Attest where the files come from
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG (Get-ChildItem dist -File).FullName --title "wslbin $env:TAG" --generate-notes
